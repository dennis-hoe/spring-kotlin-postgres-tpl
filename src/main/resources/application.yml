spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # für Entwicklung; in Produktion lieber 'validate' oder Flyway verwenden
    properties:
      hibernate:
        format_sql: true
    show-sql: true
